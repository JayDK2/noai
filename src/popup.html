<!doctype html>
<meta charset="utf-8">
<title>NoAI</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 336px; margin: 0; padding: 0;
    background: #0c0c0d; color: #e6e5e3;
    font: 13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  header { padding: 14px 16px 12px; border-bottom: 1px solid #1e1e20; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: #d9b25f; }
  .sub { margin: 3px 0 0; font-size: 11px; color: #77767a; }

  section { padding: 12px 16px; border-bottom: 1px solid #1e1e20; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; }
  .row + .row { margin-top: 2px; }
  .row label { flex: 1; cursor: pointer; }
  .row .hint { display: block; font-size: 11px; color: #77767a; margin-top: 1px; }
  input[type=checkbox] { margin: 2px 0 0; accent-color: #d9b25f; }

  .stats { display: flex; gap: 20px; }
  .stat b { display: block; font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; color: #77767a; text-transform: uppercase; letter-spacing: .06em; }

  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 11.5px; }
  dt { color: #77767a; }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

  .warn { margin-top: 8px; padding: 8px 10px; border-left: 2px solid #c2603f; background: #17100e; font-size: 11.5px; color: #e0b8a8; }
  footer { padding: 11px 16px 13px; font-size: 11px; color: #66656a; }
  a { color: #9a9899; }
  a:hover { color: #d9b25f; }
  button {
    font: inherit; font-size: 11.5px; padding: 4px 9px; cursor: pointer;
    background: #1a1a1c; color: #d8d7d5; border: 1px solid #2c2c2f; border-radius: 3px;
  }
  button:hover { border-color: #d9b25f; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 96px; overflow-y: auto; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0; font-size: 11.5px; }
  li code { color: #8f8e92; font-size: 10.5px; }
  .muted { color: #66656a; font-size: 11.5px; }
</style>

<header>
  <h1>No<span>AI</span></h1>
  <p class="sub">Community-reported AI music on Spotify Web</p>
</header>

<section>
  <div class="row">
    <input type="checkbox" id="enabled"><label for="enabled">Filter enabled</label>
  </div>
  <div class="row">
    <input type="checkbox" id="skip"><label for="skip">Auto-skip flagged tracks
      <span class="hint">Off by default. Plays about a second before skipping.</span></label>
  </div>
  <div class="row">
    <input type="checkbox" id="hide"><label for="hide">Hide instead of dim
      <span class="hint">Dimming is the default — the list is not always right.</span></label>
  </div>
</section>

<section class="stats">
  <div class="stat"><b id="s-skipped">0</b><span>skipped</span></div>
  <div class="stat"><b id="s-count">—</b><span>on list</span></div>
</section>

<section>
  <dl>
    <dt>List compiled</dt><dd id="m-date">—</dd>
    <dt>Source</dt><dd id="m-source">—</dd>
  </dl>
  <div id="warn" class="warn" hidden></div>
</section>

<section>
  <div class="row" style="justify-content:space-between;align-items:center">
    <span>Never filter these artists</span>
    <button id="add">Add current</button>
  </div>
  <ul id="allow"></ul>
  <p id="allow-empty" class="muted">Nothing allowed yet.</p>
</section>

<footer>
  Not affiliated with Spotify. This extension does not detect, block, mute, or skip advertisements.<br>
  <a href="https://github.com/JayDK2/noai/issues/new" target="_blank" rel="noopener">Report a mistake</a> ·
  <a href="https://github.com/JayDK2/noai/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy &amp; sources</a>
</footer>

<script src="popup.js"></script>
